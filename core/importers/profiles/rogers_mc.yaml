# PLACEHOLDER profile — column names and date format are made up.
# Replace once the real Rogers Mastercard CSV header + one fake example row
# for a purchase and a payment received are supplied (see spec section 14).
id: rogers_mc
display_name: Rogers Mastercard
detect:
  headers: ["Date", "Posted Date", "Description", "Amount"]
parse:
  encoding: utf-8-sig
  skip_rows: 0
  date_column: Date
  posted_date_column: Posted Date
  date_format: "%Y-%m-%d"
  description_columns: [Description]
  amount:
    mode: single
    column: Amount
    invert: true
  currency_column: null
  skip_if: []
