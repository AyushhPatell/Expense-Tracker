# Real Scotiabank chequing CSV export format (confirmed against a real export
# with values redacted; this profile itself contains no personal data).
id: scotia_chequing
display_name: Scotiabank Chequing
detect:
  headers: ["Date", "Description", "Sub-description", "Type of Transaction", "Amount", "Balance"]
parse:
  encoding: utf-8-sig
  skip_rows: 0
  date_column: Date
  date_format: "%Y-%m-%d"
  description_columns: [Description, Sub-description]
  amount:
    # Scotia's Amount column is already signed the way we want:
    # negative = money out, positive = money in. No inversion needed.
    mode: single
    column: Amount
    invert: false
  currency_column: null
  skip_if: []
